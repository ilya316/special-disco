<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1b1a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заклинания">
  <title>Книга заклинаний</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="char-switch" data-action="tab" data-tab="character" id="charName"></button>
    <span class="sync-dot off" id="syncDot"></span>
    <span class="app-ver" id="appVer"></span>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-action="tab" data-tab="spells"><span class="ico">✦</span>Заклинания</button>
    <button data-action="tab" data-tab="tracker"><span class="ico">♥</span>Трекер</button>
    <button data-action="tab" data-tab="sheet"><span class="ico">◈</span>Лист</button>
    <button data-action="tab" data-tab="inventory"><span class="ico">▤</span>Вещи</button>
    <button data-action="tab" data-tab="notes"><span class="ico">¶</span>Заметки</button>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
